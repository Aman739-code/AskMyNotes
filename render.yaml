services:
  - type: web
    name: askmynotes-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: askmynotes-api
          property: port
      - key: LOG_LEVEL
        value: info
